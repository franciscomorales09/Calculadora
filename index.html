<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1> Bienvenido a la Calculadora</h1>
    <button onclick="saludar()">saludar</button>

    <h1>Calculadora</h1>
    <label for="num1">Ingrese un Numero</label>
    <input type="number" id="num1" name="num1"> <br>
    <label for="num2">Ingrese otro Numero</label> 
    <input type="number" id="num2" name="num2"> <br>
    
    <h1 id="resultado">Resultado: </h1>

    <button onclick="suma()">+</button>

    <button onclick="resta()">-</button>

    <button onclick="multiplicacion()">*</button>

    <button onclick="division()">/</button>

    <button onclick="potencia()">^</button>
    
    <button onclick="raiz()">√</button>

    
    

    <script src="script.js"></script>

    <link rel="stylesheet" href="style.css">
    
</body>
